services:
  - type: web
    name: hr-avatar-backend
    env: python
    buildCommand: |
      pip install tensorflow-macos
      pip install --only-binary=all transformers==4.21.1
      python -m spacy download ru_core_news_sm
      pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        fromDatabase:
          name: hr-avatar-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://your-frontend-url.netlify.app